[platformio]
; 默认点灯目标。基础功能选择下方的 scale_basic 环境。
default_envs = scale_py32f002a

[env]
; 固定平台、HAL SDK 和工具链版本，便于复现同一套编译结果。
platform = https://github.com/positron96/platform-py32f0.git#32e2190799f693bae02227bb854ba4c272147c34
platform_packages =
    framework-py32f0sdk @ https://github.com/positron96/framework-py32f0sdk.git#759979e94a89a97634c1fbee4439f62abe5b91dd
    platformio/toolchain-gccarmnoneeabi @ 1.140201.0
    platformio/tool-pyocd @ ~2.3600.0
board = scale_py32f002a
framework = py32f0sdk
build_flags =
    -DUSE_HAL_DRIVER
    -DPY32F002Ax5
upload_protocol = custom
; 默认只选择 PWLINK2 Lite 的 CMSIS-DAP 接口；队友使用下方 *_jlink 环境。
custom_probe_type = cmsisdap
; 首次使用杜邦线联调采用 100kHz SWD，单位 Hz。
custom_swd_frequency = 100000
; 上传脚本指定芯片包与 SWD 参数，统计脚本补充向量表和预留堆栈占用。
extra_scripts =
    pre:tools/pio_upload.py
    post:tools/pio_size.py
    post:tools/pio_artifacts.py

[env:scale_py32f002a]
; 仅保留点灯入口 main.c，两个环境分别链接自己的 main 函数。
build_src_filter = +<*> -<scale_basic.c>

[env:scale_basic]
; 使用 scale_basic.c 作为入口，包含采样、称重、校准、按键和提示音。
build_src_filter = +<*> -<main.c>

[env:scale_py32f002a_jlink]
; 队友 ARM V9 / J-Link 的点灯入口，沿用相同芯片包与固件源码。
extends = env:scale_py32f002a
custom_probe_type = jlink

[env:scale_basic_jlink]
; 队友 ARM V9 / J-Link 的称重入口。
extends = env:scale_basic
custom_probe_type = jlink
