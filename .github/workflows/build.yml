name: Firmware and host checks

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  host:
    name: Firmware logic on host
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python tools/run_host_checks.py

  firmware:
    name: Build both firmware targets
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install platformio==6.1.19
      - run: pio run -e scale_py32f002a -e scale_basic
      - run: python tools/swd_diagnose.py --dry-run
      - uses: actions/upload-artifact@v4
        with:
          name: py32-scale-${{ github.sha }}
          path: |
            .pio/build/scale_py32f002a/firmware.elf
            .pio/build/scale_basic/firmware.elf
          include-hidden-files: true
          if-no-files-found: error
